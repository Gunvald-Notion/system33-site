<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System 33</title>
<meta name="description" content="System 33 — patterns I've noticed from my work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root{
    --void:#01030a; --pool:#96b9ff; --core:#eef4ff; --ink:#dfe8fb; --ink-dim:#8594b8;
    --sheet:rgba(6,12,30,.9); --line:rgba(150,185,255,.18);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--void);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #sky.dragging{cursor:grabbing}
  #back{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:3;
    background:rgba(6,12,30,.7);color:var(--ink);border:1px solid var(--line);border-radius:999px;
    padding:10px 16px;font:500 14px "Figtree",system-ui,sans-serif;cursor:pointer;min-height:44px}
  #back:hover{border-color:var(--pool)}
  #back:focus-visible{outline:2px solid var(--pool);outline-offset:2px}
  #hint{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;
    font-size:13px;color:var(--ink-dim);pointer-events:none;transition:opacity .9s;z-index:2}
  #social{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:3;display:flex;gap:10px}
  #social a{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;
    background:rgba(6,12,30,.7);border:1px solid var(--line);color:var(--ink-dim);transition:border-color .2s,color .2s}
  #social a:hover,#social a:focus-visible{border-color:var(--pool);color:var(--core);opacity:1}
  #social svg{width:18px;height:18px;fill:currentColor}
  #panel{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    width:min(420px,88vw);box-sizing:border-box;background:var(--sheet);border:1px solid var(--line);border-radius:14px;
    padding:14px 18px;z-index:3;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #pname{font-family:"Marcellus",Georgia,serif;font-size:21px;color:var(--core);margin:0 0 4px}
  #pline{margin:0 0 8px;font-size:14.5px;line-height:1.45}
  #proute{margin:0;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-dim)}
  [hidden]{display:none!important}
  /* a room's own page: same sky, words to read */
  #page{position:fixed;inset:0;overflow-y:auto;z-index:2;opacity:0;transition:opacity .7s ease;-webkit-overflow-scrolling:touch}
  #page.on{opacity:1}
  .pwrap{max-width:640px;margin:0 auto;padding:calc(96px + env(safe-area-inset-top,0px)) 24px calc(96px + env(safe-area-inset-bottom,0px))}
  .pcore{display:block;width:16px;height:16px;padding:0;border:0;border-radius:50%;margin:0 auto 34px;background:#f5f8ff;animation:beat 3s infinite;cursor:pointer;position:relative}
  .pcore::after{content:"";position:absolute;inset:-16px;border-radius:50%}
  .pcore:focus-visible{outline:2px solid var(--pool);outline-offset:6px}
  @keyframes beat{
    0%,100%{box-shadow:0 0 14px 5px rgba(238,244,255,.7),0 0 60px 26px rgba(150,185,255,.22)}
    4%{box-shadow:0 0 22px 9px rgba(238,244,255,.95),0 0 110px 48px rgba(150,185,255,.45)}
    12%{box-shadow:0 0 16px 6px rgba(238,244,255,.75),0 0 70px 30px rgba(150,185,255,.26)}
    16%{box-shadow:0 0 19px 7px rgba(238,244,255,.85),0 0 90px 38px rgba(150,185,255,.34)}
    40%{box-shadow:0 0 14px 5px rgba(238,244,255,.7),0 0 60px 26px rgba(150,185,255,.22)}}
  #ptitle{font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:clamp(32px,7vw,48px);line-height:1.1;text-align:center;margin:0 0 12px;color:var(--core);text-shadow:0 0 24px rgba(150,185,255,.55)}
  #plead{text-align:center;font-size:17px;line-height:1.55;color:var(--ink);max-width:34em;margin:0 auto}
  .quick{margin:40px 0 56px;padding:20px 22px;border:1px solid var(--line);border-radius:16px;background:rgba(6,12,30,.62)}
  .quick p{margin:0 0 14px;font-size:16px;line-height:1.55}
  .quick .say{font-family:"Marcellus",Georgia,serif;font-size:20px;color:var(--core)}
  .quick .route{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px;color:var(--ink-dim);margin:0}
  #copy{min-height:44px;padding:10px 20px;border-radius:999px;border:1px solid rgba(150,185,255,.45);background:rgba(150,185,255,.12);color:var(--core);font:500 15px "Figtree",system-ui,sans-serif;cursor:pointer}
  #copy:hover{background:rgba(150,185,255,.22)}
  #copy:focus-visible{outline:2px solid var(--pool);outline-offset:2px}
  .stages{position:relative;padding-left:46px}
  .stages::before{content:"";position:absolute;left:15px;top:10px;bottom:40px;width:1.5px;background:rgba(150,185,255,.14)}
  .vinefill{position:absolute;left:14px;top:10px;width:3.5px;height:0;border-radius:2px;background:linear-gradient(rgba(238,244,255,.95),rgba(150,185,255,.7));box-shadow:0 0 14px rgba(150,185,255,.85);transition:height 1s cubic-bezier(.2,.7,.2,1)}
  .stage{position:relative;padding-bottom:44px;opacity:.28;transition:opacity 1s}
  .stage.lit{opacity:1}
  .stage .dot{position:absolute;left:-37px;top:9px;width:11px;height:11px;border-radius:50%;background:#1a2a58;transition:background .6s,box-shadow .6s}
  .stage.lit .dot{background:#f5f8ff;box-shadow:0 0 12px 4px rgba(238,244,255,.75),0 0 44px 16px rgba(150,185,255,.3)}
  .stage .num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink-dim);margin:0 0 4px}
  .stage h2{font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:26px;margin:0 0 8px;color:var(--core)}
  .stage p{margin:0;font-size:16.5px;line-height:1.65;max-width:36em}
  .pfoot{margin-top:12px;text-align:center;color:var(--ink-dim);font-size:14px}
</style>
</head>
<body>
<canvas id="sky" aria-label="System 33, drawn as a tree of light branching out from its core. Click any branch or room to travel into it."></canvas>
<button id="back" hidden>Back out</button>
<div id="hint">Scroll down to follow the light. Drag to look around.</div>
<article id="page" hidden aria-live="polite"><div class="pwrap"><button class="pcore" id="pcore" type="button" aria-label="Back out"></button><h1 id="ptitle"></h1><p id="plead"></p><div id="pbody"></div></div></article>
<div id="panel" hidden role="status"><p id="pname"></p><p id="pline"></p><p id="proute"></p></div>
<div id="social" hidden>
  <a href="https://github.com/Gunvald-Notion/system33-site" target="_blank" rel="noopener" aria-label="System 33 on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>
  <a href="https://www.linkedin.com/in/gunvald7/" target="_blank" rel="noopener" aria-label="Gunvald on LinkedIn"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14.82 0H1.18C.53 0 0 .52 0 1.16v13.68C0 15.48.53 16 1.18 16h13.64c.65 0 1.18-.52 1.18-1.16V1.16C16 .52 15.47 0 14.82 0ZM4.75 13.65H2.38V6.03h2.37v7.62ZM3.56 5c-.76 0-1.38-.62-1.38-1.38 0-.76.62-1.37 1.38-1.37.76 0 1.38.61 1.38 1.37 0 .76-.62 1.38-1.38 1.38Zm10.09 8.65h-2.36V9.95c0-.9-.02-2.05-1.25-2.05-1.25 0-1.44.98-1.44 1.99v3.76H6.24V6.03h2.27v1.04h.03c.32-.6 1.09-1.24 2.24-1.24 2.4 0 2.84 1.58 2.84 3.63v4.19Z"/></svg></a>
</div>
<script>
(() => {
  const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
  const backBtn = document.getElementById('back'), hint = document.getElementById('hint');
  const panel = document.getElementById('panel'), pName = document.getElementById('pname'),
        pLine = document.getElementById('pline'), pRoute = document.getElementById('proute');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DISPLAY = '"Marcellus","Palatino Linotype",Palatino,Georgia,serif';
  const BODY = '"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif';
  const POOL = '150,185,255', CORE_C = '238,244,255', MASS = '55,95,210';
  const V = 620, PERIOD = 3, RW = 150, BY = 780, CY = 1140, N = 40;

  // ---- content: the real rooms of system33.io ----
  const DATA = [
    { name:'Methods', line:'Patterns, formalized', kids:[
      { name:'Understanding Method', line:'Six stages to understand anything', route:'/activate/understanding-method/' },
      { name:'More methods', line:'In the making', dim:true } ] },
    { name:'Courses', line:'What I study, turned into tools', kids:[
      { name:'HSM126', line:'Study and quiz tool for the statistics exam', route:'/courses/hsm126/' },
      { name:'HSM222', line:'Practice quiz for marketing, the MPC test', route:'/courses/hsm222/' } ] },
    { name:'Notes', line:'Reading, written down', kids:[
      { name:'Ed Catmull', line:'The Pixar co-founder on getting the read right', route:'/notes/ed-catmull-pixar-the-read/' },
      { name:'Gustav Söderström', line:'The Spotify Co-CEO on media worth your time', route:'/notes/gustav-soderstrom-time-well-spent/' },
      { name:'High agency', line:'Notes on George Mack', route:'/notes/george-mack-high-agency/' } ] }
  ];
  const HOME = { pre:'Welcome to', title:'System 33', sub:"Patterns I've noticed from my work", kids:DATA };
  const levelOf = d => ({ pre:null, title:d.name, sub:d.line, kids:d.kids || [] });

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = p => p * p * (3 - 2 * p);
  const easeOut = p => 1 - (1 - p) ** 3;
  const easeIn = p => p * p * p;

  // ---- curves ----
  function cps(e, t) {
    const a = e.a, b = e.b;
    const s1 = RM ? 0 : Math.sin(t * .7 + e.ph) * e.amp;
    const s2 = RM ? 0 : Math.sin(t * .55 + e.ph * 1.3) * e.amp;
    if (e.trunk) return [a.x, a.y, a.x + s1 * .4, a.y + 420, b.x + s2, b.y - 230, b.x, b.y];
    const h = (b.y - a.y) * .5;
    return [a.x, a.y, a.x + s1 * .5, a.y + h, b.x + s2, b.y - h, b.x, b.y];
  }
  function bez(p, u) {
    const v = 1 - u, a = v * v * v, b = 3 * v * v * u, c = 3 * v * u * u, d = u * u * u;
    return [a * p[0] + b * p[2] + c * p[4] + d * p[6], a * p[1] + b * p[3] + c * p[5] + d * p[7]];
  }
  function buildTab(e) {
    const p = cps(e, 0); e.cum = [0]; let q = bez(p, 0), L = 0;
    for (let i = 1; i <= N; i++) { const r = bez(p, i / N); L += Math.hypot(r[0] - q[0], r[1] - q[1]); e.cum.push(L); q = r; }
    e.len = L; e.progU = 0;
  }
  function uAt(e, f) {
    const target = f * e.len, c = e.cum;
    for (let i = 1; i <= N; i++) if (c[i] >= target) { const k = (target - c[i - 1]) / ((c[i] - c[i - 1]) || 1); return (i - 1 + k) / N; }
    return 1;
  }

  // ---- screen ----
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeStars();
    if (scene) {
      const old = scene;
      scene = buildScene(old.level);
      Object.assign(scene, { focus: old.focus, grown: old.grown, skipFirst: old.skipFirst, manual: old.manual, sigs: [], zoom: old.zoom });
      scene.edges.forEach((e, i) => e.grow = old.edges[i].grow);
      scene.nodes.forEach((n, i) => { n.rev = old.nodes[i].rev; n.revT = old.nodes[i].revT; });
      if (old.cam) scene.cam = old.cam;
    }
  }

  // ---- a scene: one core with its branches ----
  function buildScene(level) {
    const core = { kind:'core', x:0, y:0, flare:0, out:[] };
    const nodes = [], edges = [];
    const spread = clamp((W / H) * 420, 210, 380);
    const n1 = level.kids.length;
    const sp1 = n1 <= 2 ? Math.min(spread * 1.5, 460) : spread;
    level.kids.forEach((d, i) => {
      const nd = { kind:'n1', data:d, name:d.name, line:d.line, route:d.route, dim:!!d.dim,
                   depth:1, x:(i - (n1 - 1) / 2) * sp1, y:BY + (n1 > 2 ? (i % 2) * 50 : 0), flare:0, rev:false, revT:0, out:[], kids:[] };
      nodes.push(nd);
      const e = { a:core, b:nd, ph:i * 1.7, amp:16, trunk:true, grow:0 }; edges.push(e); core.out.push(e);
      const fan = Math.min(190, sp1 * .9), m = (d.kids || []).length;
      (d.kids || []).forEach((c, j) => {
        const cn = { kind:'n2', depth:2, data:c, name:c.name, line:c.line, route:c.route, dim:!!c.dim, parent:nd,
                     x:nd.x + (j - (m - 1) / 2) * fan, y:CY + (n1 > 2 ? (i % 2) * 50 : 0) + (j % 2) * 60,
                     flare:0, rev:false, revT:0, out:[] };
        nodes.push(cn); nd.kids.push(cn);
        const ce = { a:nd, b:cn, ph:i * 1.7 + j * 2.3 + 1, amp:10, trunk:false, grow:0 }; edges.push(ce); nd.out.push(ce);
      });
    });
    edges.forEach(buildTab);
    const box = list => {
      let minX = -230, maxX = 230, maxY = 220;
      list.forEach(n => { minX = Math.min(minX, n.x - 120); maxX = Math.max(maxX, n.x + 120); maxY = Math.max(maxY, n.y + 95); });
      return { minX, maxX, minY: -170, maxY };
    };
    const fit = bx => ({ x: (bx.minX + bx.maxX) / 2, y: (bx.minY + bx.maxY) / 2,
                         z: Math.min(W / (bx.maxX - bx.minX), H / (bx.maxY - bx.minY)) * .94 });
    const maxDepth = nodes.some(n => n.kind === 'n2') ? 2 : nodes.length ? 1 : 0;
    // one camera frame per ring of growth: the core, then the branches, then the rooms
    const frames = [{ x: 0, y: 50, z: Math.min(W * .82 / 440, H * .55 / 320) }];
    for (let d = 1; d <= maxDepth; d++) frames.push(fit(box(nodes.filter(n => n.depth <= d))));
    for (let i = 1; i < frames.length; i++) frames[i].z = Math.min(frames[i].z, frames[i - 1].z);
    // lock the resting frame to the branch-level fit so rooms may extend past the edge instead of forcing a further zoom-out
    for (let i = 2; i < frames.length; i++) { frames[i].x = frames[1].x; frames[i].y = frames[1].y; frames[i].z = frames[1].z; }
    const bbox = box(nodes);
    const { minX, maxX, maxY } = bbox;
    const dust = Array.from({ length: Math.round(clamp(W * H / 1400, 320, 800)) }, () => {
      const x = minX - 250 + Math.random() * (maxX - minX + 500), y = -500 + Math.random() * (maxY + 750);
      return { x, y, d: Math.hypot(x, y), lit: 0, base: .05 + Math.random() * .1 };
    });
    return { level, core, nodes, edges, bbox, frames, dust, sigs: [], pan: 0, panY: 0, zoom: 1, age: 0, focus: null,
             grown: 0, maxDepth, skipFirst: level === HOME, cam: null, manual: false };
  }

  // ---- camera: s = 0 is inside the core, s = 1 is the whole system ----
  let s = 0, sT = 0;
  function camAt(sv) {
    const F = scene.frames, K = F.length - 1;
    const zoom = scene.zoom || 1;
    if (!K) return { x: F[0].x + scene.pan, y: F[0].y + scene.panY, z: F[0].z * zoom };
    sv = clamp(sv, 0, K);
    const i = Math.min(K - 1, Math.floor(sv)), f = ease(sv - i), A = F[i], B = F[i + 1];
    const z = Math.exp(Math.log(A.z) + (Math.log(B.z) - Math.log(A.z)) * f);
    return { x: A.x + (B.x - A.x) * f + scene.pan, y: A.y + (B.y - A.y) * f + scene.panY, z: z * zoom };
  }

  // ---- sky ----
  // the sky, ported from the Sovereign Archive Map: sprite stars coloured by temperature, steady, never twinkling
  const TEMPS = [[155,176,255],[170,191,255],[202,215,255],[228,232,255],[248,247,255],[255,244,234],[255,226,196],[255,204,150]];
  const TW = [.14,.16,.2,.18,.14,.08,.06,.04];
  function pickTemp() { let r = Math.random(), a = 0; for (let k = 0; k < TW.length; k++) { a += TW[k]; if (r < a) return k; } return 2; }
  function makeSprite(size, draw) { const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size / 2); return c; }
  const DOT = TEMPS.map(t => makeSprite(32, (g, h) => {
    const p = g.createRadialGradient(h, h, 0, h, h, h);
    p.addColorStop(0, 'rgba(255,255,255,1)'); p.addColorStop(.12, `rgba(${t},.95)`); p.addColorStop(.35, `rgba(${t},.28)`); p.addColorStop(1, `rgba(${t},0)`);
    g.fillStyle = p; g.fillRect(0, 0, h * 2, h * 2);
  }));
  const BRIGHT = TEMPS.map(t => makeSprite(128, (g, h) => {
    const halo = g.createRadialGradient(h, h, 0, h, h, h * .55);
    halo.addColorStop(0, `rgba(${t},.28)`); halo.addColorStop(.3, `rgba(${t},.07)`); halo.addColorStop(1, `rgba(${t},0)`);
    g.fillStyle = halo; g.fillRect(0, 0, h * 2, h * 2);
    const spike = (len, wid, alpha, rot) => {
      g.save(); g.translate(h, h); g.rotate(rot);
      const s = g.createLinearGradient(0, -len, 0, len);
      s.addColorStop(0, `rgba(${t},0)`); s.addColorStop(.5, `rgba(255,255,255,${alpha})`); s.addColorStop(1, `rgba(${t},0)`);
      g.fillStyle = s; g.beginPath(); g.moveTo(0, -len); g.lineTo(wid, 0); g.lineTo(0, len); g.lineTo(-wid, 0); g.closePath(); g.fill(); g.restore();
    };
    spike(h * .85, .9, .24, 0); spike(h * .5, .8, .17, Math.PI / 2);
    const c2 = g.createRadialGradient(h, h, 0, h, h, h * .12);
    c2.addColorStop(0, 'rgba(255,255,255,1)'); c2.addColorStop(.5, `rgba(${t},.8)`); c2.addColorStop(1, `rgba(${t},0)`);
    g.fillStyle = c2; g.fillRect(0, 0, h * 2, h * 2);
  }));
  let stars = [];
  function makeStars() {
    const n = Math.round(clamp(W * H / 3400, 170, 520));
    stars = Array.from({ length: n }, () => {
      const z = Math.random() ** 1.6 * .85 + .15, g = Math.random() ** 3;
      return { x: Math.random(), y: Math.random(), z, temp: pickTemp(),
               r: Math.max(.3, (.45 + 2.4 * Math.sqrt(g)) * (.3 + z * 1.1) * .8), bright: g > .9,
               op: .22 + Math.random() * .5 };
    });
  }

  let scene = null, stack = [], mode = 'level', dv = null, flashA = 0, hover = null, leaveAcc = 0, diveAcc = 0, diveNode = null;
  let time = 0, nextBeat = .4, pending = 0;
  const fronts = [];

  // every main beat carries the growth one ring further out, and the camera rides along with it
  function beat(str) {
    const sc = scene;
    sc.core.flare = Math.max(sc.core.flare, str);
    fronts.push({ t0: time, str });
    let grow = false;
    if (str === 1 && sc.grown < sc.maxDepth) {
      if (sc.skipFirst) sc.skipFirst = false;
      else {
        grow = true; sc.grown++;
        let dist = 0;
        sc.edges.forEach(e => { if (e.b.depth <= sc.grown) dist = Math.max(dist, e.b.depth === 1 ? e.len : 0); });
        if (sc.grown === 2) dist += Math.max(...sc.edges.filter(e => !e.trunk).map(e => e.len));
        if (!sc.manual) sc.cam = { from: s, to: sc.grown, t: 0, dur: Math.max(.6, dist / V * .95) };
      }
    }
    sc.core.out.forEach(e => sc.sigs.push({ e, f: 0, en: str, grow }));
  }

  function glow(x, y, r, a, col) {
    if (!(r > 0) || a <= 0) return;

  function drawScene(c) {

    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(223,232,251,.75)'; ctx.font = `400 ${Math.max(11, 22 * z)}px ${BODY}`;

  const UM = `

  const ABOUT = `

  function openPage(d) {

    pBody.innerHTML = d.name === 'Understanding Method' ? UM

  function enterAbout() {

  }

  document.getElementById('pcore').addEventListener('click', () => leave());
  pBody.addEventListener('click', async e => {

    catch { e.target.textContent = 'Copying works on the real page'; }

  function startDive(node, scrub, focus) {
    if (mode !== 'level') return;

    // focus0 is where the target already sits on screen right now; the dive keeps its projected
    // position moving in a straight, bounded line from there to screen-center, instead of letting
    // position and zoom ease on independent curves and swing the target off-screen mid-flight.

    }

    scene.focus = dv.focus ? dv.focus.name : null;

  function showPanel(n) {

    let h = '';
    if (mode === 'level') {
      if (hover === scene.core) h = stack.length ? 'Click the core to go back out' : '';
      else if (hover && goesIn(hover)) h = 'Scroll to go into ' + goesIn(hover).name + ', or click it';
      else if (scene.grown >= scene.maxDepth && s > scene.maxDepth - .03 && panel.hidden) h = stack.length ? 'Click a room to open it. Back out whenever you like.' : 'Click a branch, or go straight to a room.';
    }
    if (h) hint.textContent = h;
    hint.style.opacity = h ? 1 : 0;
    requestAnimationFrame(frame);
  }

  // ---- input ----
  function hit(x, y) {
    if (mode !== 'level') return null;
    const c = camAt(s);
    let best = null, bd = 1e9;
    {
      const cx = (0 - c.x) * c.z + W / 2, cy = (0 - c.y) * c.z + H / 2;
      const d = Math.min(Math.hypot(x - cx, y - cy), Math.hypot(x - cx, y - (cy + 110 * c.z)));
      if (d < Math.max(44, 70 * c.z)) { best = scene.core; bd = d; }
    }
    for (const n of scene.nodes) {
      if (!n.rev) continue;
      const sx = (n.x - c.x) * c.z + W / 2, sy = (n.y - c.y) * c.z + H / 2;
      const d = Math.min(Math.hypot(x - sx, y - sy), Math.hypot(x - sx, y - (sy + Math.max(22, 44 * c.z))));
      if (d < 38 && d < bd) { bd = d; best = n; }
    }
    return best;
  }
  function scrollBy(dy, x, y, wheel) {
    if (mode === 'dive' && dv.scrub) { if (wheel) scrubBy(dy); return; }
    if (mode !== 'level') return;
    if (wheel && dy > 0 && scene.grown >= 1 && s > scene.grown - .15) {
      const h = hit(x, y), g = h && goesIn(h);
      // require a small build-up of scroll before committing to a dive, rather than firing on
      // the very first wheel tick. A mouse notch clears this in one go; a trackpad's stream of
      // tiny events (including its momentum tail after fingers lift) now has to actually persist
      // over the same target instead of triggering by accident.
      if (g) {
        if (diveNode !== g) { diveNode = g; diveAcc = 0; }
        diveAcc += dy;
        if (diveAcc > 46) startDive(g, false);
        return;
      }
    }
    diveNode = null; diveAcc = 0;
    if (wheel && Math.abs(s - scene.grown) < .001 && s > 0) {
      if (scene.cam) { scene.cam = null; sT = s; }
      scene.manual = true; scene.panY -= dy / camAt(s).z; return;
    }
    // Backing out: credit net upward scroll continuously, including the motion that
    // brings the level back toward its top, instead of only counting extra scroll once
    // already resting there. A stray tick in the wrong direction only bleeds some of
    // that credit rather than wiping it out, so fast jittery back-and-forth from a
    // trackpad still reads as one consistent "go back" instead of failing to leave.
    if (stack.length) {
      if (dy < 0) leaveAcc += -dy;
      else leaveAcc = Math.max(0, leaveAcc - dy * .4);
      if (sT <= 0 && leaveAcc > 260) { leave(); return; }
    } else leaveAcc = 0;
    if (scene.cam) { scene.cam = null; sT = s; }
    scene.manual = true;
    // widened so a normal scroll burst no longer slams into the top or bottom of a level
    // almost immediately
    sT = clamp(sT + dy * .0008, 0, scene.grown);
    scene.focus = null;
  }

  // ---- zoom: pinch/ctrl+wheel zooms toward the cursor, layered on top of the automatic
  // camera the same way panning already is, so it never touches dive/leave depth state ----
  function zoomBy(delta, x, y) {
    if (mode !== 'level') return;
    const c0 = camAt(s);
    const wx = (x - W / 2) / c0.z + c0.x, wy = (y - H / 2) / c0.z + c0.y;
    const baseX = c0.x - scene.pan, baseY = c0.y - scene.panY, baseZ = c0.z / (scene.zoom || 1);
    scene.zoom = clamp((scene.zoom || 1) * Math.exp(delta * .0016), .6, 5);
    const z1 = baseZ * scene.zoom;
    scene.pan = wx - baseX - (x - W / 2) / z1;
    scene.panY = wy - baseY - (y - H / 2) / z1;
    scene.manual = true;
  }

  let down = null;
  cv.addEventListener('pointerdown', e => {
    down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: 0 };
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!down) {
      const over = hit(e.clientX, e.clientY);
      hover = e.pointerType === 'mouse' ? over : null;
      cv.style.cursor = over ? 'pointer' : '';
      return;
    }
    const dx = e.clientX - down.lx, dy = e.clientY - down.ly;
    down.lx = e.clientX; down.ly = e.clientY; down.moved += Math.hypot(dx, dy);
    if (down.moved > 6) cv.classList.add('dragging');
    if (mode === 'level') {
      scene.pan -= dx / camAt(s).z;
      scene.panY -= dy / camAt(s).z;
    }
  });
  cv.addEventListener('pointerup', e => {
    cv.classList.remove('dragging');
    if (down && down.moved < 6 && mode === 'level') {
      const n = hit(e.clientX, e.clientY);
      if (!n) hidePanel();
      else if (n === scene.core) { if (stack.length) leave(); else enterAbout(); }
      else startDive(n, false);
    }
    down = null;
  });
  cv.addEventListener('pointercancel', () => { down = null; cv.classList.remove('dragging'); });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    const dx = e.deltaMode === 1 ? e.deltaX * 16 : e.deltaX;
    // trackpad pinch (and ctrl+wheel) arrive as wheel events with ctrlKey set, so they can
    // be told apart from a normal two-finger scroll without any guessing, and can zoom
    // toward the cursor without touching the dive/leave depth logic at all.
    if (e.ctrlKey) { if (mode === 'level') zoomBy(-dy, e.clientX, e.clientY); return; }
    if (mode === 'level' && Math.abs(dx) > Math.abs(dy)) { scene.pan += dx / camAt(s).z; return; }
    scrollBy(dy, e.clientX, e.clientY, true);
  }, { passive: false });
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { leave(); return; }
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') scrollBy(140, 0, 0, false);
    else if (e.key === 'ArrowUp' || e.key === 'PageUp') { if (sT <= 0 && stack.length) leave(); else scrollBy(-140, 0, 0, false); }
  });
  backBtn.addEventListener('click', leave);

  resize(); makeStars();
  scene = buildScene(HOME);
  addEventListener('resize', resize);
  const start = () => requestAnimationFrame(t => { last = t; frame(t); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
